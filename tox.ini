[tox]
requires =
    tox>=4
    tox-uv>=1
# Don't fail a local `tox` run when an interpreter from the matrix isn't
# installed. tox-uv provisions missing CPython builds through uv and CI
# provides each interpreter via tox-gh-actions.
skip_missing_interpreters = true
# Django 6.x requires Python 3.12+, so 3.10 and 3.11 only get the 5.2 LTS.
env_list =
    py{310,311}-django52
    py{312,313,314}-django{52,60,61}
    lint
    mypy
    pyright
    pyrefly
    codespell
    docs
    coverage
labels =
    test = py{310,311}-django52, py{312,313,314}-django{52,60,61}
    check = lint, mypy, pyright, pyrefly, codespell

[gh-actions]
python =
    3.10: py310-django52
    3.11: py311-django52
    3.12: py312-django52, py312-django60, py312-django61
    3.13: py313-django52, py313-django60, py313-django61
    3.14: py314-django52, py314-django60, py314-django61

[testenv]
# The pip-style runner. The lock runner (`uv sync`) ignores `deps`, and the
# Django axis below has to come from somewhere.
runner = uv-venv-runner
extras = tests
deps =
    django52: django>=5.2,<6.0
    django60: django>=6.0,<6.1
    django61: django>=6.1,<6.2
# One data file per env so parallel cells never overwrite each other and the
# CI combine job can merge the whole matrix.
set_env =
    COVERAGE_FILE = {toxinidir}/.coverage.{envname}
# Per-cell coverage gate is disabled. The `coverage` env / CI combine job is
# the single 100% gate across the whole matrix.
commands = pytest --cov-fail-under=0 {posargs}

[testenv:lint]
dependency_groups = dev
commands =
    ruff check .
    ruff format --check .

[testenv:mypy]
dependency_groups = dev
commands = mypy

[testenv:pyright]
dependency_groups = dev
commands = basedpyright

[testenv:pyrefly]
dependency_groups = dev
commands = pyrefly check

[testenv:codespell]
dependency_groups = dev
commands = codespell

[testenv:docs]
extras = docs
commands = sphinx-build -W -b html docs docs/_build/html

[testenv:coverage]
# Runs the suite once on the current Django and enforces the 100% gate
# locally. Uses a private data file so `coverage erase` can't touch the
# per-cell files of a parallel `tox -p` run.
extras = tests
set_env =
    COVERAGE_FILE = {env_tmp_dir}/.coverage
commands =
    coverage erase
    pytest --cov=tags_input --cov-report=term-missing --cov-fail-under=100
