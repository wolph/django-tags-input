name: CI

on:
  push:
    branches: [develop, master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: test-${{ matrix.python-version }}
      # tox-gh-actions maps the running interpreter to its Django cells via the
      # [gh-actions] table in tox.ini, so CI and a local `tox` run test the
      # identical matrix. Each cell writes its own .coverage.<env> data file.
      - run: uvx --with tox-uv --with tox-gh-actions tox
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-suffix: lint
      - run: uvx --with tox-uv tox -e lint

  type-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checker: [mypy, pyright, pyrefly, typing310]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-suffix: type-check-${{ matrix.checker }}
      - run: uvx --with tox-uv tox -e ${{ matrix.checker }}

  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-suffix: codespell
      - run: uvx --with tox-uv tox -e codespell

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-suffix: docs
      - run: uvx --with tox-uv tox -e docs
      - run: npm run check
        working-directory: playground
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: playground
      - run: npm test
        working-directory: playground

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv run python tools/check_distribution.py
      - run: uv build
      - run: uvx twine check dist/*

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          cache-suffix: coverage
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: uv run coverage combine
      - run: uv run coverage report --show-missing --fail-under=100
      - run: uv run coverage lcov -o coverage.lcov
      - name: Upload combined coverage to Coveralls
        if: >-
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.lcov
          format: lcov
          git-branch: ${{ github.ref_name }}
          git-commit: ${{ github.sha }}
          fail-on-error: true
